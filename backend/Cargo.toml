[package]
name = "benefrance-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "benefrance-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.9", features = ["ws"] }
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
reqwest = { version = "0.12.12", features = ["json"] }
tower-http = { version = "0.6.2", features = ["fs", "trace"] }
tower-cookies = "0.10.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
thiserror = "2.0.11"
uuid = { version = "1.11.0", features = ["v4"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
chrono-tz = "0.10.0"
rand = "0.8.5"
sha2 = "0.10.8"
hex = "0.4.3"
lettre = { version = "0.11.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

[dev-dependencies]
testcontainers = "0.23.1"
testcontainers-modules = { version = "0.11.4", features = ["postgres"] }
wiremock = "0.6.2"
