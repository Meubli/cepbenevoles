services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: benefrance_e2e
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "11025:1025" # SMTP
      - "18025:8025" # HTTP API/UI

  sheets-stub:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./e2e/sheets-stub:/app:ro
    command: ["node", "server.mjs"]
    environment:
      PORT: "8089"
    ports:
      - "18089:8089"
