name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  SQLX_OFFLINE: "true"

jobs:
  guardrails:
    name: Lint & format
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets -- -D warnings

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --version 0.8.3

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SQLX_OFFLINE: "false"
        run: sqlx migrate run

      - name: cargo sqlx prepare --check (fails if .sqlx/ is stale)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          SQLX_OFFLINE: "false"
        run: cargo sqlx prepare --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: svelte-check
        working-directory: frontend
        run: npm run check

      - name: eslint + prettier
        working-directory: frontend
        run: npm run lint

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: cargo test (integration, uses testcontainers)
        run: cargo test --manifest-path backend/Cargo.toml

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build backend release binary
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install e2e deps
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start test services (Postgres, Mailpit, Sheets stub)
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
